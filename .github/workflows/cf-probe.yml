name: CF-Probe

# Einmalige, rein lesende Prüfung der Cloudflare-Rechte des Deploy-Tokens.
# Wird nach dem Test wieder entfernt.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/cf-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Rechte und Dienste prüfen
        run: |
          call() {
            label="$1"; path="$2"
            body=$(curl -s -m 30 -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4$path")
            echo "== $label"
            echo "$body" | jq -c '{success, errors: [.errors[]? | {code, message}], count: (.result | if type=="array" then length else null end)}' 2>/dev/null || echo "keine JSON-Antwort"
          }
          call "Token gültig (Account-Token)" "/accounts/$ACC/tokens/verify"
          call "Token gültig (User-Token)" "/user/tokens/verify"
          call "R2-Buckets" "/accounts/$ACC/r2/buckets"
          call "D1-Datenbanken" "/accounts/$ACC/d1/database"
          call "KV-Namespaces" "/accounts/$ACC/storage/kv/namespaces"
          call "Workers-Scripts" "/accounts/$ACC/workers/scripts"
          call "Access-Apps" "/accounts/$ACC/access/apps"
          call "Access-Organisation" "/accounts/$ACC/access/organizations"
